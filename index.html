    <meta
      name="description"
      content="Urban Outline is a Pakistan-based clothing store for men, women, boys and girls. Easy everyday pieces, thoughtful details and cash on delivery nationwide."

    <link rel="canonical" href="https://urban-outline.vercel.app/" />

    <meta property="og:type" content="website" />

    <script>
      // Apply the saved theme before first paint so dark mode does not flash.
      try {
        if (localStorage.getItem('urban-outline-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {
        console.warn('Theme preference unavailable.', error)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Urban Outline needs JavaScript enabled to show products and checkout.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
